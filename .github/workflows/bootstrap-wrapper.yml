name: bootstrap-wrapper

# One-off: generates the Gradle wrapper in CI (no local JDK on the dev machine).
# Removed once the wrapper is committed.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/bootstrap-wrapper.trigger'

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          cache-provider: basic
      - name: Generate wrapper in a clean directory
        run: |
          SHA=$(curl -fsSL https://services.gradle.org/distributions/gradle-9.7.1-bin.zip.sha256)
          mkdir -p /tmp/w && cd /tmp/w
          echo 'rootProject.name = "w"' > settings.gradle.kts
          gradle wrapper --gradle-version 9.7.1 --distribution-type bin --gradle-distribution-sha256-sum "$SHA"
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/"
          mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/gradle/wrapper/"
      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git commit -m "chore: add Gradle 9.7.1 wrapper"
          git push
