name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Secret scan
        run: bash scripts/secret-scan.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Test and build the demo APK
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk voz-demo.apk
          sha256sum voz-demo.apk > voz-demo.apk.sha256
          python3 scripts/release-notes.py "$GITHUB_REF_NAME" > release-notes.md
          echo "" >> release-notes.md
          echo "### Verified by CI for this tag" >> release-notes.md
          python3 scripts/test-summary.py core app >> release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" voz-demo.apk voz-demo.apk.sha256 \
            --title "VOZ $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
