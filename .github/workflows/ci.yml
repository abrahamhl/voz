name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Secret scan
        run: bash scripts/secret-scan.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # 'basic' = open-source GitHub Actions cache (the default 'enhanced' provider is a proprietary component).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Core unit tests
        run: ./gradlew --no-daemon :core:test
      - name: App unit tests, lint and debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Release build has no network access and no cloud brain
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          "$aapt2" dump permissions "$apk" > release-permissions.txt
          cat release-permissions.txt
          if grep -q "android.permission.INTERNET" release-permissions.txt; then echo "release APK must not request INTERNET"; exit 1; fi
          "$aapt2" dump resources "$apk" | grep -A1 "bool/cloud_brain_available" > release-cloud.txt
          cat release-cloud.txt
          grep -q "false" release-cloud.txt || { echo "cloud brain must be off in release builds"; exit 1; }
      - name: Test summary
        if: always()
        run: python3 scripts/test-summary.py core app | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: voz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports
            app/build/reports
